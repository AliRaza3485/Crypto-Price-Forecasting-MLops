# ============================================================
# Central configuration for Crypto-Price-Forecasting-MLops
# Change values HERE — no need to touch any code.
# All paths are relative to the project root.
# ============================================================

data:
  # --- Which market to pull from Binance ---
  symbol: "BTCUSDT"            # Bitcoin priced in USDT
  interval: "1h"              # candle size: 1m, 5m, 15m, 1h, 4h, 1d ...
  lookback: "2 years ago UTC"  # how far back to fetch

  # --- Where the raw data is saved (relative to project root) ---
  raw_dir: "data/raw"
  raw_file: "btc.parquet"

  # --- Where the cleaned/processed data is saved ---
  processed_dir: "data/processed"
  processed_file: "btc_clean.parquet"

# ============================================================
# Feature engineering settings
# ============================================================
features:
  target_horizon: 1                 # predict this many hours ahead (1 = next hour)
  lags: [1, 2, 3, 6, 12, 24]        # past hourly returns to feed the model
  roll_windows: [6, 12, 24]         # rolling window sizes, in hours
  featured_file: "btc_features.parquet"

# ============================================================
# Train / test split settings
# ============================================================
split:
  test_size: 0.2                    # last 20% of time -> test (chronological, NO shuffle)
  x_train_file: "X_train.parquet"
  y_train_file: "y_train.parquet"
  x_test_file: "X_test.parquet"
  y_test_file: "y_test.parquet"

# ============================================================
# Model settings
# ============================================================
# The winning RandomForest config. Hyperparameter SEARCH is experimentation and
# lives in notebooks/02_model_experiment.ipynb (Optuna + TimeSeriesSplit). These
# are the best params it found — production training just reads them, so every
# run is fast, deterministic and reproducible.
model:
  algorithm: "random_forest"
  random_state: 42
  params:
    n_estimators: 250
    max_depth: 3
    min_samples_leaf: 34
    max_features: 0.5649947641875525
  # Where the trained model is saved locally (MLflow registry is the source of truth)
  model_dir: "models"
  model_file: "rf_model.joblib"

# ============================================================
# MLflow / DagsHub experiment tracking
# ============================================================
# NOTE: credentials are NOT here — they live in .env (git-ignored). See .env.example.
mlflow:
  experiment_name: "btc-return-forecasting"     # groups all runs on DagsHub
  run_name: "random_forest_prod"                # this training run's name
  registered_model_name: "btc-rf-forecaster"    # versioned name in the Model Registry
