# ============================================================
# Central configuration for Crypto-Price-Forecasting-MLops
# Change values HERE — no need to touch any code.
# All paths are relative to the project root.
# ============================================================
#
# ------------------------------------------------------------
# KEY DESIGN DECISIONS  (the "why" behind this project)
# The full narrative lives in README.md; the short version is here so anyone
# editing this config understands the reasoning behind each value.
# ------------------------------------------------------------
# 1. GOAL — this is an MLOps ENGINEERING showcase, NOT a money-making trading
#    bot. Profitable short-term price prediction is unrealistic (efficient
#    markets + hedge-fund competition). What's on show is the full lifecycle:
#    live ingestion -> features -> train/registry -> serve -> drift monitor
#    -> Docker -> CI/CD -> cloud deploy.
#
# 2. PREDICT RETURN, NOT RAW PRICE — target = next-hour RETURN
#    (close.shift(-1)/close - 1); price is rebuilt as price*(1+return). BTC
#    keeps making new all-time highs and tree models CANNOT extrapolate beyond
#    prices seen in training, so a scale-free return target is essential.
#    (drives -> features:)
#
# 3. EVERY FEATURE IS SCALE-FREE — returns, close/moving-average ratios,
#    rolling volatility, log-volume. Same reason as #2: nothing that grows
#    with price, so the model generalises to future price regimes.
#    (drives -> features:)
#
# 4. FIXED (not per-run) HYPERPARAMETERS — the Optuna + TimeSeriesSplit search
#    lives in notebooks/02_model_experiment.ipynb; production training just
#    READS the winning params below, so every run is fast, deterministic and
#    reproducible.  (drives -> model.params)
#
# 5. PSI DECIDES DRIFT, KS IS INFORMATIONAL — on ~14k reference rows the KS
#    test flags EVERY feature (over-sensitive on large samples: p-value ~0
#    even for stable ones). PSI is sample-size robust, so PSI is the decision
#    metric and KS is reported for context only.  (drives -> monitoring:)
#
# 6. CHRONOLOGICAL SPLIT, NO SHUFFLE — it's a time series. The LAST 20% of
#    time is the test set; shuffling would leak the future into training.
#    (drives -> split:)
#
# 7. BINANCE AS THE LIVE SOURCE — real-time, fine granularity, no API key for
#    public market data. Caveat: Binance.com is geo-blocked in the US (HTTP
#    451), so the EC2 box is deployed in a NON-US region.  (drives -> data:)
#
# 8. HONEST ABOUT ACCURACY — gains over a naive "predict 0 return" baseline
#    are microscopic (~1e-5 RMSE). That is EXPECTED: hourly crypto is close to
#    a random walk; a large improvement would signal data leakage, not skill.
# ============================================================
serving:
  # Short recent window used ONLY for live prediction (not training).
  # "3 days ago UTC" -> ~72 hourly candles, safely more than the 25 rows
  # the features need (longest lookback = 24), with buffer for any
  # candles Binance might be missing.
  live_lookback: "3 days ago UTC"

data:
  # --- Which market to pull from Binance ---
  symbol: "BTCUSDT"            # Bitcoin priced in USDT
  interval: "1h"              # candle size: 1m, 5m, 15m, 1h, 4h, 1d ...
  lookback: "2 years ago UTC"  # how far back to fetch

  # --- Where the raw data is saved (relative to project root) ---
  raw_dir: "data/raw"
  raw_file: "btc.parquet"

  # --- Where the cleaned/processed data is saved ---
  processed_dir: "data/processed"
  processed_file: "btc_clean.parquet"

# ============================================================
# Feature engineering settings
# ============================================================
features:
  target_horizon: 1                 # predict this many hours ahead (1 = next hour)
  lags: [1, 2, 3, 6, 12, 24]        # past hourly returns to feed the model
  roll_windows: [6, 12, 24]         # rolling window sizes, in hours
  featured_file: "btc_features.parquet"

# ============================================================
# Train / test split settings
# ============================================================
split:
  test_size: 0.2                    # last 20% of time -> test (chronological, NO shuffle)
  x_train_file: "X_train.parquet"
  y_train_file: "y_train.parquet"
  x_test_file: "X_test.parquet"
  y_test_file: "y_test.parquet"

# ============================================================
# Model settings
# ============================================================
# The winning RandomForest config. Hyperparameter SEARCH is experimentation and
# lives in notebooks/02_model_experiment.ipynb (Optuna + TimeSeriesSplit). These
# are the best params it found — production training just reads them, so every
# run is fast, deterministic and reproducible.
model:
  algorithm: "random_forest"
  random_state: 42
  params:
    n_estimators: 250
    max_depth: 3
    min_samples_leaf: 34
    max_features: 0.5649947641875525
  # Where the trained model is saved locally (MLflow registry is the source of truth)
  model_dir: "models"
  model_file: "rf_model.joblib"

# ============================================================
# MLflow / DagsHub experiment tracking
# ============================================================
# NOTE: credentials are NOT here — they live in .env (git-ignored). See .env.example.
mlflow:
  experiment_name: "btc-return-forecasting"     # groups all runs on DagsHub
  run_name: "random_forest_prod"                # this training run's name
  registered_model_name: "btc-rf-forecaster"    # versioned name in the Model Registry

# ============================================================
# Monitoring / data-drift detection
# ============================================================
# Compares the feature distributions the model was TRAINED on (X_train, the
# "reference") against RECENT live features (the "current" batch). If the
# recent data looks statistically different, the model is seeing conditions it
# wasn't trained on -> a signal to investigate / retrain.
monitoring:
  # How much recent data to pull for the drift check. Much bigger than the
  # live-predict window (3 days), because comparing DISTRIBUTIONS needs MANY
  # rows -- a single latest candle can't form a distribution.
  drift_lookback: "30 days ago UTC"

  # Thresholds that decide "is this drift?"
  ks_pvalue_threshold: 0.05   # KS test: p-value below this => distributions differ
  psi_moderate: 0.10          # PSI 0.10-0.20 => moderate shift (watch)
  psi_major: 0.20             # PSI >= 0.20 => significant drift

  # A feature counts as "drifted" if its PSI >= psi_major. The overall report
  # raises the DRIFT flag once at least this many features have drifted.
  min_drifted_features: 3
retrain:
  drift_gate: true          # if true, only retrain when drift is detected (unless --force)
  # Candidate must beat champion RMSE by at least this much to be promoted.
  # Grounded in this project's own documented scale: the tuned model beats
  # the naive baseline by only ~1e-5 RMSE (see "Honest result" in README),
  # so a margin of 0.0 accepts pure noise as "improvement". 1e-6 is one
  # order of magnitude below that signal -- big enough to reject
  # run-to-run RandomForest/data-window noise, small enough not to block
  # a real win given how close-to-random-walk this target is.
  promotion_margin: 0.000001
  container_name: "crypto-api"   # docker container to restart after a promotion

# ============================================================
# Prediction history logging
# ============================================================
# Powers the frontend's "predicted vs actual" panel. A lightweight background
# scheduler (inside the API process -- no separate cron job) calls
# /predict/live's logic every poll_interval_minutes, logs the result to a
# small SQLite file, and backfills actual_price once each prediction's
# target hour has actually passed. See src/monitoring/history.py.
history:
  db_dir: "data/history"
  db_file: "predictions.db"
  poll_interval_minutes: 60   # how often the scheduler logs a fresh live prediction